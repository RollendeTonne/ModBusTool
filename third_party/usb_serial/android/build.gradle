group 'dev.bessems.usbserial'
version '1.0'

// Modernised for current Flutter/AGP (see MODIFIED.md): no buildscript
// block (the app provides AGP), no jcenter, Java 17, lint{} DSL.
apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Hosted on JitPack; the repository is declared in the app's
    // android/build.gradle.kts.
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
    compileOnly 'androidx.annotation:annotation:1.9.1'
}
