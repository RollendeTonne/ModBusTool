include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - lib/core/l10n/generated/**
    - "**/*.g.dart"
    - third_party/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # App, not a published package: API docs on every public member add noise.
    public_member_api_docs: false
